async function hash(s,salt){const b=new TextEncoder().encode(salt+':'+s);let digest=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('')};function authInit(){let a=localStorage.getItem(AUTH);$('setup').classList.toggle('hidden',!!a);$('signin').classList.toggle('hidden',!a)}async function createAccess(){let name=$('setupName').value.trim(),p=$('setupPass').value;if(!name||p.length<8||p!==$('setupConfirm').value){$('authError').textContent='Informe o nome e duas senhas iguais com pelo menos 8 caracteres.';return}let salt=uid();localStorage.setItem(AUTH,JSON.stringify({salt,hash:await hash(p,salt),name}));db.user=name;save();start()}async function login(){let a=JSON.parse(localStorage.getItem(AUTH));if(await hash($('loginPass').value,a.salt)!==a.hash){$('authError').textContent='Senha incorreta.';return}start()}function start(){sessionStorage.setItem(SESSION,'active');try{db=JSON.parse(localStorage.getItem(KEY))||db}catch(e){}db.clients||=[];db.events||=[];db.trainings||=[];db.user=JSON.parse(localStorage.getItem(AUTH)).name;$('auth').style.display='none';$('app').style.display='grid';$('who').textContent=db.user;go('dashboard')}function logout(){sessionStorage.removeItem(SESSION);$('app').style.display='none';$('auth').style.display='block';$('loginPass').value='';authInit()}function toast(msg){$('toast').textContent=msg+(!legacyMode&&localStorage.getItem('ps_cs_pending')==='1'?' · aguardando salvamento no servidor':'');$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)}function record(id,action,detail){db.events.push({id:uid(),clientId:id,at:new Date().toISOString(),actor:db.user,action,detail})}function statusAlert(c){if(!c.implementation||c.followupDone||c.activationStatus==='Ativada')return null;let due=datePlus(c.implementation,7),d=daysTo(due);return {due,d,kind:d<0?'late':d===0?'soon':'ok'}}function openDialog(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').showModal()}function closeModal(){$('modal').close()}function go(page){current=page;preferences.page=page;persistPreferences();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.id==='nav-'+page));$('pageTitle').textContent={dashboard:'Painel de CS',clients:'Carteira de clientes',alerts:'Follow-ups de implantação',reports:'Relatórios',team:'Equipe e acessos',account:'Minha conta',backup:'Dados e segurança'}[page];render()}
function render(){if(current==='dashboard')dashboard();if(current==='clients')clients();if(current==='alerts')alerts();if(current==='reports')reports();if(current==='team')renderTeam();if(current==='account')renderAccount();if(current==='backup')backup()};function dashboard(){let all=db.clients,pend=all.filter(c=>statusAlert(c)),due=pend.filter(c=>statusAlert(c).d<=0),contract=all.filter(c=>c.contractPortal&&!c.contractSigned);$('view').innerHTML=`<div class="cards"><div class="card">Em implantação<strong>${all.filter(c=>(c.implementation||c.implementationConfirmed)&&c.stage!=='Concluído').length}</strong></div><div class="card">Follow-ups vencidos/hoje<strong>${due.length}</strong></div><div class="card">Ativações de carteira<strong>${all.filter(c=>c.activationStatus==='Ativada').length}</strong></div></div><div class="panel"><div class="split"><h2>Prioridades de acompanhamento</h2><button class="secondary" onclick="go('alerts')">Ver todos</button></div>${due.length?due.map(c=>`<div class="notice split"><div><strong>${esc(c.fantasy)}</strong> · ${esc(c.cnpj)}<br><small>Follow-up ${fmt(statusAlert(c).due)} · ${statusAlert(c).d<0?'Atrasado':'Hoje'}</small></div><button onclick="detail('${c.id}')">Abrir ficha</button></div>`).join(''):'<p class="muted">Nenhum follow-up vencido ou previsto para hoje.</p>'}</div><div class="panel"><h2>Últimos registros</h2>${db.events.slice().sort((a,b)=>b.at.localeCompare(a.at)).slice(0,8).map(e=>`<div class="notice"><strong>${esc(db.clients.find(c=>c.id===e.clientId)?.fantasy||'Central')}</strong> — ${esc(e.action)}<br><small>${new Date(e.at).toLocaleString('pt-BR')} · ${esc(e.detail)}</small></div>`).join('')||'<p class="muted">Sem registros ainda.</p>'}</div>`}
function clientSortDate(c){if(c.implementation)return c.implementation;if(!c.contractSigned)return c.arrival||'';return ''}function clients(){let list=db.clients.slice().sort((a,b)=>{let da=clientSortDate(a),dbb=clientSortDate(b);return (da&&dbb?da.localeCompare(dbb):da?-1:dbb?1:0)||String(a.fantasy||'').localeCompare(String(b.fantasy||''),'pt-BR')});$('view').innerHTML=`<div class="panel"><div class="split"><div><h2>Clientes (${list.length})</h2><small class="muted">Ordem crescente: chegada para contratos pendentes e início da implantação para clientes em implantação. Clientes sem data aplicável aparecem ao final.</small></div><input id="search" style="max-width:320px" placeholder="Buscar por nome, CNPJ ou ticket" oninput="filterClients()"></div><div style="margin:16px 0"><label for="clientFilter">Filtrar clientes</label><select id="clientFilter" onchange="filterClients()" style="max-width:320px"><option value="all">Todos os clientes</option><option value="contract">Aguardando contrato</option><option value="implementation">Implantação</option><option value="activation">Ativação de carteira</option></select><div id="activationMonthControls" class="hidden" style="margin-top:12px"><label for="activationMonth">Mês e ano da ativação</label><div class="actions"><input id="activationMonth" type="month" value="${activationToday().slice(0,7)}" onchange="filterClients()" style="max-width:220px"><button class="secondary" onclick="exportActivationReport()">Exportar relatório CSV</button></div><small class="muted">Filtra pela data da ativação. Limpe o mês para visualizar todos os períodos.</small></div><p id="filterCount" class="muted" aria-live="polite">Exibindo ${list.length} cliente(s)</p></div><div class="tablewrap"><table><thead><tr><th>Nome fantasia</th><th>CNPJ</th><th>Etapa</th><th>Ticket inicial</th><th>Chegada</th><th>Implantação</th><th>Follow-up</th><th>Data da ativação</th><th>Ticket de ativação</th><th>Ações</th></tr></thead><tbody id="clientRows">${list.map(c=>clientRow(c)).join('')}</tbody></table></div></div>`}function clientCategory(c){let categories=[];if(!c.contractPortal&&!c.implementation&&!c.implementationConfirmed&&c.activationStatus!=='Ativada')categories.push('contract');if((c.implementation||c.implementationConfirmed)&&!['Ativação de carteira','Concluído'].includes(c.stage)&&c.activationStatus!=='Ativada')categories.push('implementation');if(c.activationStatus==='Ativada'&&['Ativação de carteira','Concluído'].includes(c.stage))categories.push('activation');return categories.join(' ')}function clientRow(c){let a=statusAlert(c);return `<tr data-activation="${esc(c.activationDate||'')}" data-category="${clientCategory(c)}" data-search="${esc((c.fantasy+' '+c.cnpj+' '+c.ticket).toLowerCase())}"><td><strong>${esc(c.fantasy)}</strong></td><td>${esc(c.cnpj)}</td><td>${stageBadge(c.stage)}</td><td>${esc(c.ticket)}</td><td>${fmt(c.arrival)}</td><td>${fmt(c.implementation)}</td><td>${a?`<span class="tag ${a.kind}">${fmt(a.due)} ${a.d<=0?'⚠':''}</span>`:c.followupDone?'Realizado':'—'}</td><td>${c.activationStatus==='Ativada'?fmt(c.activationDate):'—'}</td><td>${esc(c.activationTicket||'—')}</td><td><button onclick="detail('${c.id}')">Abrir</button> ${clientCategory(c).split(' ').includes('implementation')?`<button class="secondary" onclick="activateWalletForm('${c.id}')">Ativar carteira</button>`:''}</td></tr>`}function activationToday(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}function activateWalletForm(id){openDialog('Ativar carteira',`<form onsubmit="saveWalletActivation(event,'${id}')"><p>A ativação será registrada nesta Central de CS.</p>${field('activationTicket','Número do ticket','text','','required')}${field('activationDate','Data da ativação','date',activationToday(),'readonly')}<p><button type="submit">Confirmar ativação</button></p></form>`)}function saveWalletActivation(e,id){e.preventDefault();let ticket=String(new FormData(e.target).get('activationTicket')||'').trim();if(!ticket){e.target.elements.activationTicket.setCustomValidity('Informe o número do ticket.');e.target.elements.activationTicket.reportValidity();e.target.elements.activationTicket.setCustomValidity('');return}let c=db.clients.find(x=>x.id===id);if(!c)return;let issue=clientDateMessage({...c,activationDate:activationToday()});if(issue){alert(issue);return}let previous=JSON.stringify(db);c.activationTicket=ticket;c.activationDate=activationToday();c.activationStatus='Ativada';c.stage='Concluído';captureActivationSeller(c);record(id,'Carteira ativada',`Ticket: ${ticket} — Data: ${fmt(c.activationDate)}`);try{save()}catch(error){db=JSON.parse(previous);alert('Não foi possível salvar a ativação. Tente novamente.');return}let filter=$('clientFilter')?.value,query=$('search')?.value;closeModal();render();if(current==='clients'){if(filter)$('clientFilter').value=filter;if(query)$('search').value=query;filterClients()}toast('Ativação registrada com ticket e data.')}function filterClients(){let q=$('search').value.toLowerCase(),category=$('clientFilter').value,month=$('activationMonth').value,count=0;$('activationMonthControls').classList.toggle('hidden',category!=='activation');document.querySelectorAll('#clientRows tr').forEach(tr=>{let visible=tr.dataset.search.includes(q)&&(category==='all'||tr.dataset.category.split(' ').includes(category))&&(category!=='activation'||!month||tr.dataset.activation.slice(0,7)===month);tr.style.display=visible?'':'none';if(visible)count++});$('filterCount').textContent=category==='activation'?`Total de clientes ativados${month?' em '+month.slice(5,7)+'/'+month.slice(0,4):''}: ${count}`:`Exibindo ${count} cliente(s)`}
function activationReportRows(month,query){return db.clients.filter(c=>clientCategory(c).split(' ').includes('activation')&&(!month||String(c.activationDate||'').slice(0,7)===month)&&((c.fantasy+' '+c.cnpj+' '+c.ticket).toLowerCase().includes(query))).sort((a,b)=>String(a.activationDate||'9999').localeCompare(String(b.activationDate||'9999'))||String(a.fantasy).localeCompare(String(b.fantasy),'pt-BR'))}
function csvCell(value){let text=String(value??'');if(/^[=+@\-\t\r]/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"'}
function exportActivationReport(){let month=$('activationMonth').value,rows=activationReportRows(month,$('search').value.toLowerCase());if(!rows.length){toast('Nenhum cliente encontrado neste período.');return}let data=[['Nome fantasia','CNPJ','Data da ativação','Ticket de ativação','Etapa','Status da ativação'],...rows.map(c=>[c.fantasy,c.cnpj,fmt(c.activationDate),c.activationTicket,c.stage,c.activationStatus])];let blob=new Blob(['\uFEFF'+data.map(row=>row.map(csvCell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='ativacoes-'+(month||'todos-periodos')+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(rows.length+' cliente(s) exportado(s).')}
const fields=['fantasy','cnpj','owner','seller','ticket','arrival','contractPortal','contractSigned','onboarding','implementation','activationDate','activationTicket','activationStatus','stage','responsible','followupDone','followupDate','followupNotes','notes'];const labels={fantasy:'Nome fantasia',cnpj:'CNPJ',owner:'Proprietário',seller:'Vendedor responsável',activationSeller:'Vendedor na ativação',ticket:'Ticket inicial',arrival:'Data de chegada',contractPortal:'Contrato lançado no Portal PS',contractSigned:'Contrato assinado',onboarding:'Início do onboarding',implementation:'Início da implantação',implementationTicket:'Ticket da implantação',activationDate:'Data da ativação da carteira',activationTicket:'Ticket de ativação',activationStatus:'Status da ativação',stage:'Etapa atual',responsible:'Responsável CS',followupDone:'Follow-up realizado',followupDate:'Data do follow-up',followupNotes:'Resultado do follow-up',notes:'Observações'};const dateFields=['arrival','contractPortal','contractSigned','onboarding','implementation','activationDate','followupDate'];function openClient(id){let c=db.clients.find(x=>x.id===id)||{},form=`<form id="clientForm" data-client-id="${esc(id||'')}" oninput="updateStagePreview(this);checkDuplicateCnpj(this)" onchange="updateStagePreview(this);checkDuplicateCnpj(this)" onsubmit="saveClient(event,'${id||''}')"><div class="grid">${fields.filter(k=>!['followupDone','followupDate','followupNotes','notes','stage','activationStatus'].includes(k)).map(k=>field(k,labels[k],dateFields.includes(k)?'date':'text',c[k]||'',k==='fantasy'||k==='cnpj'?'required':k==='seller'?'list="sellerNames" maxlength="100" placeholder="Selecione ou digite o vendedor"':k==='responsible'?'list="csResponsibleList" placeholder="Selecione ou digite o responsável"':'')).join('')}<datalist id="sellerNames">${sellerNames().map(n=>`<option value="${esc(n)}"></option>`).join('')}</datalist><datalist id="csResponsibleList"></datalist><div><label>Etapa atual (automática)</label><div id="stagePreview" class="notice ${stageClass(automaticStage(c))}">${esc(automaticStage(c))}</div><p id="dateWarning" class="error" role="status"></p></div>${options('activationStatus','Status da ativação',['Não solicitada','Solicitada','Em análise','Ativada','Pendente'],c.activationStatus||'Não solicitada')}</div>${area('notes','Observações gerais',c.notes)}<p><button type="submit">Salvar cliente</button></p></form>`;openDialog(id?'Editar cliente':'Novo cliente',form);loadResponsibleOptions();checkDuplicateCnpj($('clientForm'))}function saveClient(e,id){e.preventDefault();let fd=new FormData(e.target),data={};for(let k of fields)if(fd.has(k))data[k]=String(fd.get(k)).trim();if(data.activationStatus==='Ativada'){if(!data.activationTicket){alert('Informe o ticket de ativação para concluir a implantação.');return}data.stage='Concluído';data.activationStatus='Ativada';data.activationDate=data.activationDate||activationToday()}data.stage=automaticStage({...db.clients.find(c=>c.id===id),...data});let dateError=clientDateMessage(data);if(dateError){alert(dateError);return}data.cnpj=data.cnpj.replace(/\D/g,'');if(data.cnpj.length!==14){alert('Informe um CNPJ com 14 dígitos.');return}if(checkDuplicateCnpj(e.target)){e.target.elements.cnpj.focus();return}let c=db.clients.find(x=>x.id===id);if(c){let changes=Object.keys(data).filter(k=>String(c[k]||'')!==String(data[k]||''));changes.forEach(k=>record(c.id,'Campo atualizado',`${labels[k]}: ${c[k]||'—'} → ${data[k]||'—'}`));captureActivationSeller(data,c);Object.assign(c,data)}else{c={id:uid(),...data,followupDone:false,followupDate:'',followupNotes:''};captureActivationSeller(c);db.clients.push(c);record(c.id,'Cliente cadastrado',`Ticket inicial: ${c.ticket||'—'}`)}save();closeModal();toast('Cliente salvo com histórico.');render();detail(c.id)}
function detail(id){selected=id;let c=db.clients.find(x=>x.id===id);if(!c)return;let a=statusAlert(c),ev=db.events.filter(x=>x.clientId===id).sort((a,b)=>b.at.localeCompare(a.at)),tr=db.trainings.filter(x=>x.clientId===id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));openDialog(c.fantasy,`<div class="split">${stageBadge(c.stage)}<div class="actions"><button class="secondary" onclick="openClient('${id}')">Editar cadastro</button><button onclick="trainingForm('${id}')">+ Treinamento</button><button class="secondary" onclick="noteForm('${id}')">+ Registro</button><button class="secondary" onclick="showServerAudit('${id}')">Alterações por usuário</button></div></div><div class="grid three">${['cnpj','owner','ticket','arrival','contractPortal','contractSigned','onboarding','implementation','activationDate','activationTicket','activationStatus','seller','responsible'].map(k=>`<div class="notice"><small>${labels[k]}</small><br><strong>${esc(dateFields.includes(k)?fmt(c[k]):c[k]||'—')}</strong></div>`).join('')}</div><div class="panel"><h2>Follow-up após 7 dias</h2>${c.implementation?`<p>Início: <b>${fmt(c.implementation)}</b> · Prazo: <b>${fmt(datePlus(c.implementation,7))}</b></p><p><span class="tag ${a?a.kind:'ok'}">${c.followupDone?'Concluído':a?.d<0?'Atrasado':a?.d===0?'Vence hoje':'Pendente'}</span></p>`:'<p class="muted">Informe a data de início da implantação para gerar o prazo.</p>'}${c.followupDone?`<p>Realizado em ${fmt(c.followupDate)} · ${esc(c.followupNotes)}</p>`:`<button ${!c.implementation?'disabled':''} onclick="followupForm('${id}')">Registrar follow-up</button>`}</div><div class="panel"><h2>Treinamentos (${tr.length})</h2>${tr.map(t=>`<div class="notice"><strong>${esc(t.subject)}</strong> · ${fmt(t.date)} · <span class="tag">${esc(t.status)}</span><br><small>Participantes: ${esc(t.participants||'—')} · Ticket: ${esc(t.ticket||'—')} · ${esc(t.notes||'')}</small></div>`).join('')||'<p class="muted">Nenhum treinamento registrado.</p>'}</div><div class="panel"><h2>Histórico cronológico (${ev.length})</h2><div class="timeline">${ev.map(x=>`<div class="event"><strong>${esc(x.action)}</strong><small>${new Date(x.at).toLocaleString('pt-BR')} · ${esc(x.actor)}</small><p>${esc(x.detail)}</p></div>`).join('')}</div></div>`)}
function followupForm(id){openDialog('Registrar follow-up',`<form onsubmit="saveFollowup(event,'${id}')">${field('date','Data do contato','date',today(),'required')}${area('result','Resultado do contato / pendências')}<p><button>Concluir follow-up</button></p></form>`)}function saveFollowup(e,id){e.preventDefault();let c=db.clients.find(x=>x.id===id),fd=new FormData(e.target);let issue=clientDateMessage({...c,followupDate:fd.get('date')});if(issue){alert(issue);return}c.followupDone=true;c.followupDate=fd.get('date');c.followupNotes=fd.get('result');record(id,'Follow-up realizado',`${fmt(c.followupDate)} — ${c.followupNotes}`);save();detail(id);toast('Follow-up concluído.')}function trainingForm(id){openDialog('Adicionar treinamento',`<form onsubmit="saveTraining(event,'${id}')"><div class="grid">${field('subject','Assunto / módulo','text','','required')}${field('date','Data','date',today(),'required')}${field('participants','Participantes')}${field('ticket','Ticket relacionado')}${options('status','Situação',['Agendado','Realizado','Pendente','Cancelado'],'Agendado')}</div>${area('notes','Observações e próximos passos')}<p><button>Salvar treinamento</button></p></form>`)}function saveTraining(e,id){e.preventDefault();let t={id:uid(),clientId:id};new FormData(e.target).forEach((v,k)=>t[k]=v);db.trainings.push(t);record(id,'Treinamento registrado',`${t.subject} — ${fmt(t.date)} — ${t.status}; ticket ${t.ticket||'—'}`);save();detail(id);toast('Treinamento registrado.')}function noteForm(id){openDialog('Registrar movimentação',`<form onsubmit="saveNote(event,'${id}')">${field('action','Tipo de movimentação','text','','required')}${area('detail','Descrição detalhada')}<p><button>Adicionar ao histórico</button></p></form>`)}function saveNote(e,id){e.preventDefault();let f=new FormData(e.target);record(id,f.get('action'),f.get('detail'));save();detail(id);toast('Registro incluído.')}function alerts(){let pending=db.clients.filter(c=>statusAlert(c)).sort((a,b)=>statusAlert(a).d-statusAlert(b).d);$('view').innerHTML=`<div class="panel"><h2>Alertas calculados automaticamente</h2><p class="muted">Prazo de 7 dias corridos após o início da implantação. Os alertas são atualizados ao abrir o sistema.</p>${pending.map(c=>{let a=statusAlert(c);return `<div class="notice split"><div><strong>${esc(c.fantasy)}</strong> · ${esc(c.cnpj)}<br><small>Ticket: ${esc(c.ticket||'—')} · Implantação ${fmt(c.implementation)} · Prazo ${fmt(a.due)}</small><br><span class="tag ${a.kind}">${a.d<0?`${-a.d} dia(s) atrasado`:a.d===0?'Vence hoje':`Em ${a.d} dia(s)`}</span></div><button onclick="detail('${c.id}')">Acompanhar</button></div>`}).join('')||'<p class="muted">Nenhum follow-up pendente.</p>'}</div>`}
function backup(){$('view').innerHTML=`<div class="panel"><h2>Backup e restauração</h2><p>Exporte regularmente os registros para um arquivo JSON. O arquivo contém dados de clientes e deve ser guardado em local corporativo autorizado e protegido.</p><div class="actions"><button onclick="exportBackup()">Exportar backup JSON</button><button class="secondary" onclick="$('importFile').click()">Importar backup</button><input id="importFile" class="hidden" type="file" accept="application/json,.json" onchange="importBackup(event)"></div><p class="hint">A importação substitui todos os clientes, treinamentos e eventos deste navegador. Não inclui a senha local.</p></div><div class="panel"><h2>Limitações desta versão</h2><p>Sem servidor, sem sincronização entre dispositivos, sem autenticação corporativa, sem integração com Portal PS e sem envio de notificações quando o navegador estiver fechado. O histórico é registrado, mas um usuário com acesso ao armazenamento local pode alterá-lo.</p></div>`}function exportBackup(){let blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`central-cs-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importBackup(e){let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.clients)||!Array.isArray(data.events)||!Array.isArray(data.trainings))throw Error('Estrutura inválida');if(!confirm('Substituir TODOS os registros locais pelos dados deste backup?'))return;db={clients:data.clients,events:data.events,trainings:data.trainings,user:db.user};save();go('dashboard');toast('Backup importado.')}catch(err){alert('Não foi possível importar: '+err.message)}}
</script></body></html>
